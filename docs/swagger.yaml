    put:
      consumes:
      - application/json
      description: S2.4 PUT /v1/platform/features/{scope}/{id}/{feature}. FeaturePolicy
        names features.update for any scope and features.account.update for the account
        scope. Neither is a permission row, so a platform_admins row is the gate and
        stands in for both. The pair is not a second gate. The body is {"enabled":bool}.
        An unknown key stores nothing. global, user, and chain are 404 for a platform
        admin. An unknown account is 404 for a platform admin. A closed global row
        is not applied and is not written.
      parameters:
      - description: Feature scope
        in: path
        name: scope
        required: true
        type: string
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      - description: Feature key
        in: path
        name: feature
        required: true
        type: string
      produces:
