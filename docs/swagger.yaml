  /platform/features/{scope}/{id}:
    get:
      description: S2.4 GET /v1/platform/features/{scope}/{id}. features.view is not
        a permission row, so a platform_admins row is the gate. Scope account returns
        that account's stored booleans. A missing row is the catalog default and is
        not inserted. Global rows are not applied. global, user, and chain are 404
        for a platform admin. An unknown account is 404 for a platform admin.
      parameters:
      - description: Feature scope
        in: path
        name: scope
        required: true
        type: string
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/features.List'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: One account's feature flags
      tags:
      - Platform Features
    put:
      consumes:
      - application/json
      description: S2.4 PUT /v1/platform/features/{scope}/{id}. FeaturePolicy names
        features.update for any scope and features.account.update for the account
        scope. Neither is a permission row, so a platform_admins row is the gate and
        stands in for both. The pair is not a second gate. The body is {"features":[{"key","enabled"}]}.
        Every key is checked before the first write. An unknown key stores nothing.
        global, user, and chain are 404 for a platform admin. An unknown account is
        404 for a platform admin. A closed global row is not applied and is not written.
        Omitted flags are not inserted.
      parameters:
      - description: Feature scope
        in: path
        name: scope
        required: true
        type: string
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      produces:
