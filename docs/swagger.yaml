      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/withdrawals.Lookup'
        "400":
          description: idempotency_key must be a UUID
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: wallet not found / withdrawal not found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "429":
          description: Rate limit exceeded (too_many_requests, Retry-After header)
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Look up a withdrawal by idempotency key
      tags:
      - Wallet Withdrawals
  /api/v1/webhooks:
    get:
      description: Returns the account's webhook configurations plus legacy unowned
        ones it can claim with PATCH.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.ConfigList'
