  /v1/wallets/{walletId}/settings:
    get:
      description: Returns fee, approval, and freeze settings for a wallet
      parameters:
      - description: Wallet UUID
        in: path
        name: walletId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.WalletSettingsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get wallet settings
      tags:
      - Wallet Settings
    patch:
      consumes:
      - application/json
      description: Updates the wallet's name and fee settings. Requires wallet or
        account owner/admin. Only the listed fields are accepted; each may be omitted
        (unchanged) or null (reset to the network default). fee_multiplier (1.0000–5.0000,
        up to 4 decimals) scales the gas price on EVM chains and the fee rate on Bitcoin,
        in fee estimates and in the withdrawals themselves; it does not apply to Solana.
        fee_rate_min/fee_rate_max (1–10000 sat/vB, min ≤ max) clamp the Bitcoin fee
        rate. Freezing uses POST /freeze.
      parameters:
      - description: Wallet UUID
        in: path
        name: walletId
        required: true
        type: string
      - description: Settings payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateWalletSettingsSwagger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.WalletSettingsResponse'
        "400":
          description: no settings to update
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "422":
          description: invalid or unknown field
          schema:
            $ref: '#/definitions/controllers.WalletSettingsFieldError'
      security:
      - BearerAuth: []
      summary: Update wallet settings
      tags:
      - Wallet Settings
