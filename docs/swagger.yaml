host: localhost:8080
info:
  contact:
    email: support@vault.dev
    name: API Support
  description: Multi-chain cryptocurrency custody service with deposit scanning, withdrawals,
    and webhooks
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Vault Custody Service API
  version: "1.0"
paths:
  /accounts:
    post:
      consumes:
      - application/json
      description: Creates an account and makes the caller its owner
      parameters:
      - description: Account payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateAccountSwagger'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new account
      tags:
      - Accounts
  /accounts/{accountId}:
    get:
      description: Returns account details. Requires account membership (injected
        by AccountContext middleware).
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Account'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an account
      tags:
      - Accounts
    patch:
      consumes:
      - application/json
      description: Updates account name or view_all_wallets flag. Requires owner or
        admin role.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateAccountSwagger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update account settings
      tags:
      - Accounts
  /accounts/{accountId}/archive:
    post:
      description: Sets account status to 'archived'. Requires owner role.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Account'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive an account
      tags:
      - Accounts
  /accounts/{accountId}/freeze:
    post:
      description: Sets account status to 'frozen'. Requires owner role.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Account'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Freeze an account
      tags:
      - Accounts
  /accounts/{accountId}/tokens:
    get:
      description: Returns all non-expired access tokens for the account. Requires
        owner or admin.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AccessTokenListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List API access tokens for an account
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      description: Creates a named access token. The raw token is returned once —
        store it safely. Requires owner or admin.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateAccountTokenSwagger'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.CreateAccountTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an API access token for an account
      tags:
      - Accounts
  /accounts/{accountId}/tokens/{tokenId}:
    delete:
      description: Deletes an access token by ID. Requires owner or admin.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Token UUID
        in: path
        name: tokenId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an API access token
      tags:
      - Accounts
  /accounts/{accountId}/users:
    get:
      description: Returns all active members of the account with their roles
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AccountUserListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List account members
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      description: Adds a user to the account with the specified role. Requires owner
        or admin.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: User and role payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.AddAccountUserSwagger'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AccountUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a user to an account
      tags:
      - Accounts
  /accounts/{accountId}/users/{userId}:
    delete:
      description: Soft-deletes the account_user membership. Requires owner or admin.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: User UUID to remove
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a user from an account
      tags:
      - Accounts
  /api/v1/wallets/{walletId}/fee-estimate:
    get:
      description: Prices the withdrawal POST /withdrawals would send, with the same
        planner and chain adapters, without signing or broadcasting. The fee is always
        in the chain's native coin (ETH, POL, BTC, LTC, SOL, TRX), also for tokens.
        EVM transfers are legacy transactions paying gas_price_wei for every unit
        of gas (plus the L1 data fee on OP-stack networks); Bitcoin and Litecoin use
        the node's fee rate and the coin selection the builder runs; Solana pays 5000
        lamports per signature plus the recipient's token account when it must be
        created; TRON is priced as burned TRX with no free or staked resources (bandwidth
        per signed byte, 1.1 TRX to activate a new recipient, TRC-20 energy from estimateenergy
        at the chain's energy price), broken down in details.tron. When the wallet
        cannot cover the amount, the fee of the transfer from the base address is
        returned with insufficient_funds=true. Answers are cached for FEE_ESTIMATE_CACHE_TTL_SECONDS
        (default 15). Node failures answer 503; no value is guessed.
      parameters:
      - description: Wallet UUID
        format: uuid
        in: path
        name: walletId
        required: true
        type: string
      - description: Asset symbol; the chain's native coin when omitted
        example: USDC
        in: query
        name: asset
        type: string
      - description: Decimal amount, as sent to POST /withdrawals; the smallest transfer
          when omitted
        example: "0.001"
        in: query
        name: amount
        type: string
      - description: Destination address; a probe recipient when omitted
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feeestimate.Estimate'
        "400":
          description: invalid_amount
          schema:
            $ref: '#/definitions/controllers.FeeEstimateErrorResponse'
        "404":
          description: wallet not found (or owned by another account)
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "422":
          description: unknown_asset, invalid_address, amount_below_minimum, token_balance_required,
            unsupported_chain
          schema:
            $ref: '#/definitions/controllers.FeeEstimateErrorResponse'
        "429":
          description: sweep_limit_exceeded
          schema:
            $ref: '#/definitions/controllers.FeeEstimateErrorResponse'
        "503":
          description: fee_estimate_unavailable, gas_estimate_failed
          schema:
            $ref: '#/definitions/controllers.FeeEstimateErrorResponse'
      security:
      - BearerAuth: []
      summary: Estimate a withdrawal's network fee
      tags:
      - Wallet Withdrawals
  /api/v1/wallets/{walletId}/withdrawals/{idempotencyKey}:
    get:
      description: Returns the outcome of a withdrawal created with the given idempotency_key
        (the key is also the withdrawal id). Lets a client that lost the create response
        learn whether the withdrawal was broadcast or failed. Scoped to the token's
        account.
      parameters:
      - description: Wallet UUID
        in: path
        name: walletId
        required: true
        type: string
      - description: Idempotency key (UUID) sent when the withdrawal was created
        in: path
        name: idempotencyKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.WithdrawalLookupResponse'
        "400":
          description: idempotency_key must be a UUID
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: wallet not found / withdrawal not found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Look up a withdrawal by idempotency key
      tags:
      - Wallet Withdrawals
  /api/v1/webhooks:
    get:
      description: Returns the account's webhook configurations plus legacy unowned
        ones it can claim with PATCH.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.WebhookConfigListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      - SignatureAuth: []
      summary: List webhooks
      tags:
      - Webhooks
    post:
      consumes:
      - application/json
      description: Registers an account-level webhook endpoint. Deliveries are POSTed
        as JSON and signed with HMAC-SHA256 of the raw body in `X-Vault-Signature`
        (hex, keyed by `secret`); `X-Vault-Event` carries the event type and `X-Vault-Delivery-Id`
        the event id. Supported events include deposit.confirmed, withdrawal.broadcast,
        withdrawal.confirmed and withdrawal.failed. Withdrawal events are only delivered
        for wallets of the token's account.
      parameters:
      - description: Webhook configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateWebhookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.WebhookConfig'
        "400":
          description: Missing required fields
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      security:
