  /platform/accounts/{accountId}/settings/{group}:
    get:
      description: GET /v1/platform/accounts/{accountId}/settings/{group} settings.view
        (platform-managed account groups). settings.view is not in a platform catalog,
        so a platform_admins row is the gate. An unknown group, a platform-only group,
        and an account-managed group are 404 for a platform admin, before the account
        lookup. An unknown account is 404 for a platform admin. A known group with
        no stored row is 200 with registry defaults and is_set false. A secret is
        never returned. The read writes no activity and does not read another account's
        rows.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Settings group
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.GroupView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Read one platform-managed account settings group
      tags:
      - Platform Settings
    put:
      consumes:
      - application/json
      description: PUT /v1/platform/accounts/{accountId}/settings/{group} settings.update
        + sweep.update for account_sweep_limits. Those names are not in a platform
        catalog, so a platform_admins row is the gate. Any other group name is 404
        for a platform admin, before the account lookup. An unknown account is 404
        for a platform admin. A non-admin is 403 whatever the account or group. Counts
        must be positive integers. Zero or negative counts, and a negative daily cap,
        are 422 validation_failed and are not stored. A blank daily_withdraw_cap_usd
        is stored empty and stays unlimited. The write is this account's row. Activity
        is settings.updated with the account id, the group, and the field names, never
        the values. The account cache key for the group is forgotten.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Settings group
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.GroupView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Save one account sweep-limits override
      tags:
      - Platform Settings
