          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Send one platform mail test
      tags:
      - Platform Settings
