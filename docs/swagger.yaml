      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/features.Flag'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Set one account feature flag
      tags:
      - Platform Features
  /platform/settings:
    get:
      description: Sections, blocks, and platform groups. S1.4.6 names settings.view
        and filters by each group's ViewPermission. This branch has no platform permission
        catalog, so a platform_admins row is the gate and stands in for a group ViewPermission
        that is not in that catalog. Account groups are omitted. A secret is never
        returned; the field carries is_set. The read writes no activity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.RegistryView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: List platform settings
      tags:
      - Platform Settings
  /platform/settings/{group}:
    get:
      description: One platform group. S1.4.6 names settings.view plus the group's
        ViewPermission. A non-admin is 403 on every platform route, whatever the group.
        An unknown group, including an account-only group, is 404 for a platform admin.
        This branch has no platform permission catalog, so a platform_admins row is
        the gate and stands in for a group ViewPermission that is not in that catalog.
        A group with no stored row is 200 with registry defaults; a secret is never
        returned and the field carries is_set. The read writes no activity.
      parameters:
      - description: Settings group
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.GroupView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Read one platform settings group
      tags:
      - Platform Settings
    put:
      consumes:
      - application/json
      description: Writes one platform group. webhook_delivery stores max_attempts
        and timeout_seconds. sweep_limits stores positive address and consolidate
        counts; a blank daily_withdraw_cap_usd means unlimited. mail_smtp stores host,
        port, encryption, and username; the password is sealed and omitted from the
        response (is_set reports whether one is stored). A blank password keeps the
        stored one. mail_delivery stores driver, from_address, and from_name in the
        clear. An invalid address, an empty name, and driver log in production are
        422 and are not stored. mail_ses, mail_mailgun, mail_resend, and mail_postmark
        store their provider fields; each secret is sealed and omitted, a blank secret
        keeps the stored one, and mail_ses key and secret must be set together. price_lookup
        stores provider_order. price_coingecko, price_coinmarketcap, and price_coinapi
        store enabled and a sealed key that is omitted from the response; a blank
        key keeps the stored one. An unknown provider name is 422 and is not stored.
        provider_alchemy stores enabled and a sealed auth_token that is omitted from
        the response; a blank auth_token keeps the stored one. provider_helius and
        provider_quicknode store enabled and a sealed api_key that is omitted from
        the response; a blank api_key keeps the stored one. provider_etherscan stores
        enabled and a sealed api_key that is omitted from the response; a blank api_key
        keeps the stored one. Zero or negative counts, and a negative cap, are 422
        and are not stored. An unknown group is 404 for a platform admin. Values are
        not written to the activity log.
      parameters:
      - description: Settings group
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.GroupView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Save one platform settings group
      tags:
      - Platform Settings
  /platform/settings/mail/test:
    post:
      consumes:
      - application/json
      description: 'POST /v1/platform/settings/mail/test. S1.4.6: settings.update
        + mail.update, declared before {group}. Neither permission is in the platform
        catalog, so a platform_admins row is the gate. A non-admin is 403 before the
        body is read. The body field is to. An invalid address is 422 validation_failed
        and nothing is sent. One message goes through facades.Mail, which reads mail_smtp
        and mail_delivery at send time. The answer is {"sent": true}. A mailer failure
        is 502 {"error":{"code","message"}} and the message does not include the password
        or the SMTP host credentials. The test is not audited.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.MailTestSent'
        "401":
