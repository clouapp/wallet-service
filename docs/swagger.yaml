host: localhost:8080
info:
  contact:
    email: support@vault.dev
    name: API Support
  description: Multi-chain cryptocurrency custody service with deposit scanning, withdrawals,
    and webhooks
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Vault Custody Service API
  version: "1.0"
paths:
  /accounts:
    post:
      consumes:
      - application/json
      description: Creates an account and makes the caller its owner
      parameters:
      - description: Account payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/accounts.CreateAccountSwagger'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_macrowallets_waas_app_http_resources_dashboard_accounts.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a new account
      tags:
      - Accounts
  /accounts/{accountId}:
    get:
      description: Returns account details and the account's active feature keys.
        Requires account membership (injected by AccountContext middleware).
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accounts.AccountDetail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get an account
      tags:
      - Accounts
    patch:
      consumes:
      - application/json
      description: Updates account name or view_all_wallets flag. Requires owner or
        admin role.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/accounts.UpdateAccountSwagger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_macrowallets_waas_app_http_resources_dashboard_accounts.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update account settings
      tags:
      - Accounts
  /accounts/{accountId}/activity:
    get:
      description: GET /v1/accounts/{accountId}/activity applies policies.MayReadActivity
        (activity.read) before the handler. Owner, admin, and auditor may list. A
        user may not, and that refusal does not return the activity list. The refusal
        is 403 with the same message the service returns. Newest first. Page JSON
        is data, total, limit, and offset. Metadata never includes a secret value.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Account activity
      tags:
      - Account Activity
  /accounts/{accountId}/activity/{id}:
    get:
      description: GET /v1/accounts/{accountId}/activity/{id} resolves the row before
        activity.read. Another account, a platform row, or an unknown id is 404, including
        for a user. Owner, admin, and auditor may read a row that is there. A user
        may not, and that refusal is 403 with the same message the list route returns.
        The body is one element of the list. Metadata never includes a secret value.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Activity UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/activity.AccountActivity'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: One account activity row
      tags:
      - Account Activity
  /accounts/{accountId}/archive:
    post:
      description: Sets account status to 'archived'. Requires owner role.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_macrowallets_waas_app_http_resources_dashboard_accounts.Account'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Archive an account
      tags:
      - Accounts
  /accounts/{accountId}/features:
    get:
      description: GET /v1/accounts/{accountId}/features applies policies.MayViewSettings
        (settings.read) before the handler. Owner, admin, and auditor may list. A
        user may not, and that refusal does not return the feature list. The refusal
        is 403 with the message the service returns. A missing row uses the catalog
        default. There is no account-side write.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/features.List'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Account feature flags
      tags:
      - Account Features
  /accounts/{accountId}/freeze:
    post:
      description: Sets account status to 'frozen'. Requires owner role.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_macrowallets_waas_app_http_resources_dashboard_accounts.Account'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Freeze an account
      tags:
      - Accounts
  /accounts/{accountId}/permissions:
    get:
      description: Every permission the account code catalog assigns. Owner, admin
        and auditor may read. User receives 403. There is no permissions table and
        no write.
      parameters:
      - description: Account UUID
        in: path
