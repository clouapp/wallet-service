name: CI

# Pull requests run it directly; a push to main or dev runs it through deploy.yml
# (workflow_call), so a deploy never starts before its CI passed.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Integration test binaries at once: the hosted runner has 4 vCPUs.
  TEST_PARALLEL: 4

jobs:
  build:
    name: Build, vet and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The repository lint is report mode (make lint); here a pull request fails only on
      # findings it introduces.
      - name: golangci-lint (new issues)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          only-new-issues: true

  unit:
    name: Unit tests (architecture in ratchet mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make test-unit
        run: make test-unit

  integration:
    name: Integration tests (PostgreSQL, Redis, LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The suites read the local ports and credentials from .env.dev, then
      # .env.testing overrides the safety-critical values (database, Redis index, keys).
      - name: Local env
        run: cp .env.dev.example .env.dev

      # The compose services keep their container names (make docker exec's waas-postgres).
      # LocalStack runs plain: the snapshot hooks of docker-compose.yml need a key that
      # only a workstation has, and the suites seed what they read.
      - name: Start PostgreSQL, Redis and LocalStack
        run: |
          docker run -d --name waas-localstack -p 4566:4566 \
            -e SERVICES=sqs,secretsmanager,kms -e AWS_DEFAULT_REGION=us-east-1 \
            localstack/localstack@sha256:3225d60a8cbc8bbd129e97ea48a9f96acb3e1f51a1d19dbe586c444c4bcf762b
          docker compose --env-file .env.dev up -d --wait postgres redis
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4566/_localstack/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:4566/_localstack/health

      - name: make test-integration
        run: make test-integration
