name: macro-wallets

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: waas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-vault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - waas-network

  # =============================================================================
  # Redis Cache
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: waas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - waas-network

  # =============================================================================
  # Mailpit (local SMTP catcher)
  # =============================================================================
  # Local MAIL_MAILER=smtp with no host of its own delivers here. MAIL_MAILER=log
  # is the other local driver and is refused when APP_ENV is production.
  mailpit:
    image: axllent/mailpit:v1.27.1
    container_name: waas-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - waas-network

  # =============================================================================
  # WaaS API Service (for local development)
  # =============================================================================
  waas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waas-api
    restart: unless-stopped
    environment:
      ENV: dev
      PORT: ${PORT:-2002}
      DATABASE_URL: postgres://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ETH_RPC_URL: ${ETH_RPC_URL:-https://eth-mainnet.g.alchemy.com/v2/demo}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-mainnet.g.alchemy.com/v2/demo}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      BTC_RPC_URL: ${BTC_RPC_URL:-https://blockstream.info/api}
      API_KEY_SECRET: ${API_KEY_SECRET:-dev-secret-key-change-in-production}
      MASTER_KEY_REF: ${MASTER_KEY_REF:-local:dev-master-key}
      WEBHOOK_QUEUE_URL: ""
      WITHDRAWAL_QUEUE_URL: ""
    ports:
      - "${PORT:-2002}:${PORT:-2002}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - waas-network
    profiles:
      - api  # Only start with: docker-compose --profile api up

  # =============================================================================
  # LocalStack (AWS Service Emulation)
  # =============================================================================
  # The community image has no native persistence: Secrets Manager (MPC share B) is re-seeded
  # from encrypted snapshots in localstack_data by the hooks in docker/localstack/ (key outside the repo).
  localstack:
    # community 4.12.1.dev44 (build 2026-01-06), pinned so a pull cannot change the snapshot/hook behaviour
    image: localstack/localstack@sha256:3225d60a8cbc8bbd129e97ea48a9f96acb3e1f51a1d19dbe586c444c4bcf762b
    container_name: waas-localstack
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - SERVICES=sqs,secretsmanager,kms
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SECRETS_SNAPSHOT_INTERVAL=${LOCALSTACK_SECRETS_SNAPSHOT_INTERVAL:-60}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
      - "${LOCALSTACK_PORT_ALT:-4571}:4571"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/localstack/bin:/etc/localstack/secrets-snapshot:ro
      - ./docker/localstack/init/ready.d/50-secrets-snapshot.sh:/etc/localstack/init/ready.d/50-secrets-snapshot.sh:ro
      - ./docker/localstack/init/shutdown.d/50-secrets-snapshot.sh:/etc/localstack/init/shutdown.d/50-secrets-snapshot.sh:ro
      - ${LOCALSTACK_SEED_KEY_DIR:-${HOME}/.config/macro-wallets/localstack-seed}:/run/secrets/localstack-seed:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - waas-network

  # =============================================================================
  # Test Runner (for running tests in Docker)
  # =============================================================================
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: waas-test-runner
    environment:
      APP_ENV: testing
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-vault}_test
      DB_USERNAME: ${POSTGRES_USER:-vault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vault}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 15
      TEST_DB_REQUIRED: 1
    command: go test -p 1 ./... -v -race -count=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - waas-network
    profiles:
      - test  # Only start with: docker-compose --profile test up

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  localstack_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  waas-network:
    driver: bridge
