with-expecter: true
dir: tests/mocks
outpkg: mocks
filename: "mock_{{.InterfaceName}}.go"
mockname: "Mock{{.InterfaceName}}"
resolve-type-alias: false
issue-845-fix: true
log-level: error
packages:
  github.com/macrowallets/waas/app/services/swap:
    interfaces:
      Provider:
        config:
          filename: mock_SwapProvider.go
          mockname: MockSwapProvider
      Policy:
        config:
          filename: mock_SwapPolicy.go
          mockname: MockSwapPolicy
      Store:
        config:
          filename: mock_SwapStore.go
          mockname: MockSwapStore
      Wallets:
        config:
          filename: mock_SwapWallets.go
          mockname: MockSwapWallets
      Catalog:
        config:
          filename: mock_SwapCatalog.go
          mockname: MockSwapCatalog
      Credentials:
        config:
          filename: mock_SwapCredentials.go
          mockname: MockSwapCredentials
      Execution:
        config:
          filename: mock_SwapExecution.go
          mockname: MockSwapExecution
      Verifier:
        config:
          filename: mock_SwapVerifier.go
          mockname: MockSwapVerifier
      Deposits:
        config:
          filename: mock_SwapDeposits.go
          mockname: MockSwapDeposits
      CreditClaims:
        config:
          filename: mock_SwapCreditClaims.go
          mockname: MockSwapCreditClaims
  github.com/macrowallets/waas/app/services/swapcustody:
    interfaces:
      Authority:
        config:
          filename: mock_SwapAuthority.go
          mockname: MockSwapAuthority
      Registry:
        config:
          filename: mock_SwapRegistry.go
          mockname: MockSwapRegistry
      Steps:
        config:
          filename: mock_SwapSteps.go
          mockname: MockSwapSteps
      Transactions:
        config:
          filename: mock_SwapTransactions.go
          mockname: MockSwapTransactions
  github.com/macrowallets/waas/app/services/sweep:
    interfaces:
      PreparedSigner:
  github.com/macrowallets/waas/pkg/types:
    interfaces:
      # types.Chain stays the hand-written MockChain; a generated MockChain would collide.
      TransferGasEstimator:
      L1DataFeeEstimator:
      MPCSignatureFinalizer:
  github.com/macrowallets/waas/app/services/mpc:
    interfaces:
      Service:
  github.com/macrowallets/waas/app/services/queue:
    interfaces:
      Sender:
